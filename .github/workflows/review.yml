name: Revue Claude

# Revue automatique de chaque PR selon REVIEW.md. Échoue si au moins un finding « Important » :
# rendre ce check obligatoire dans la protection de main une fois le secret configuré.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  revue:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Relis la PR #${{ github.event.pull_request.number }} en suivant REVIEW.md, passe par passe.
            Publie tes findings en commentaires inline puis un commentaire de synthèse.
            Termine en écrivant le nombre de findings « Important » dans le fichier review-result.txt
            (une seule ligne, un entier).
          claude_args: |
            --max-turns 30
            --allowedTools Read,Glob,Grep,Write(review-result.txt),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment
      - name: Bloquer si finding Important
        run: |
          N=$(cat review-result.txt 2>/dev/null || echo "absent")
          echo "Findings Important : $N"
          [ "$N" = "0" ] || { echo "::error::Revue : $N finding(s) Important (ou résultat absent)."; exit 1; }
