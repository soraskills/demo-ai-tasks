name: Claude Code

# Déclencheurs :
#  - label "claude" posé sur une issue  → Claude réalise la tâche et ouvre une PR
#  - mention "@claude" dans un commentaire d'issue/PR → Claude répond / corrige
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Repo public : seuls les membres ayant accès en écriture peuvent déclencher Claude.
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GITHUB_TOKEN n'a pas accès aux Projects d'organisation :
      # PROJECT_TOKEN = PAT (fine-grained) avec "Projects: read & write" sur l'org soraskills.
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Statut → In progress (Claude)
        if: github.event_name == 'issues' && env.GH_TOKEN != ''
        run: bash .claude/scripts/project-status.sh "$ISSUE_URL" "In progress (Claude)"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          # Un des deux : clé API, ou jeton d'abonnement Claude (`claude setup-token`)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          branch_prefix: claude/
          track_progress: true
          # Claude lit les runs CI de la PR (check « verify ») : sur les PR ouvertes par un bot,
          # l'action refuse les commandes npm (restrict_untrusted_prs, laissé actif car le repo est public).
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 60
            --allowedTools Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh issue view:*),Bash(npm test:*),Bash(npm run lint:*),Bash(npm run test\:props:*),Bash(npm run sdlc\:trace:*),Bash(npx playwright test:*)

      - name: Statut → Needs review
        if: success() && github.event_name == 'issues' && env.GH_TOKEN != ''
        run: bash .claude/scripts/project-status.sh "$ISSUE_URL" "Needs review"

      - name: Statut → Blocked
        if: failure() && github.event_name == 'issues' && env.GH_TOKEN != ''
        run: bash .claude/scripts/project-status.sh "$ISSUE_URL" "Blocked"
